id: inspirational_itineraries_form
title: 'Inspirational Itineraries Form'
description: ''
categories: {  }
elements: |-
  journey_details:
    '#type': fieldset
    '#title': 'Selected Journey Details'
    journey_id:
      '#type': textfield
      '#title': 'Journey ID'
    journey_departure_id:
      '#type': textfield
      '#title': 'Departure ID'
    journey_title:
      '#type': textfield
      '#title': 'Journey Title'
    journey_data:
      '#type': textarea
      '#title': 'Journey Full Data (JSON)'
  travel_preferences:
    '#type': fieldset
    '#title': 'Travel Preferences'
    guests:
      '#type': number
      '#title': Guests
      '#default_value': 1
    traveling_with_children:
      '#type': radios
      '#title': 'Traveling with Children'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
    flight_assistance:
      '#type': radios
      '#title': 'Flight Assistance Required'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
    travel_year:
      '#type': textfield
      '#title': 'Travel Year'
    travel_month:
      '#type': textfield
      '#title': 'Travel Month'
    customizations:
      '#type': checkboxes
      '#title': Customizations
      '#options':
        'I would like to explore different accommodation categories or stay styles': 'I would like to explore different accommodation categories or stay styles'
        'I would like to adjust how relaxed or packed the journey feels': 'I would like to adjust how relaxed or packed the journey feels'
    stopovers:
      '#type': checkboxes
      '#title': Stopovers
      '#options':
        dubai-2n: 'Dubai (2 Nights)'
        mumbai-2n: 'Mumbai (2 Nights)'
        singapore-2n: 'Singapore (2 Nights)'
        doha-2n: 'Doha (2 Nights)'
    discuss_custom_stopovers:
      '#type': checkbox
      '#title': 'Discuss custom stopovers'
    trip_reason:
      '#type': select
      '#title': 'Reason for Trip'
      '#options':
        Anniversary: Anniversary
        Honeymoon: Honeymoon
        Vacation: Vacation
        Birthday: Birthday
        Graduation: Graduation
        Other: Other
    travel_info_note:
      '#type': textarea
      '#title': 'Travel Note / Vision'
  personal_details:
    '#type': fieldset
    '#title': 'Personal Information'
    title:
      '#type': textfield
      '#title': Title
    first_name:
      '#type': textfield
      '#title': 'First Name'
      '#required': true
    last_name:
      '#type': textfield
      '#title': 'Last Name'
      '#required': true
    country_code:
      '#type': textfield
      '#title': 'Country Code'
    phone:
      '#type': tel
      '#title': Phone
      '#required': true
    email_id:
      '#type': email
      '#title': Email
      '#required': true
    consent:
      '#type': checkbox
      '#title': 'Consent to terms'
      '#required': true
